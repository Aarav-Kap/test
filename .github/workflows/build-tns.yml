name: Build NspireAI TNS

on:
  workflow_dispatch:
  push:
    paths:
      - "calculator/**"
      - ".github/workflows/build-tns.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Build TI-Nspire executable
        shell: bash
        run: |
          mkdir -p dist
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/work" \
            -w /work/calculator \
            bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093 \
            make

      - name: Check output
        shell: bash
        run: |
          test -f dist/nspire_ai.tns
          ls -lh dist/nspire_ai.tns

      - name: Upload nspire_ai.tns
        uses: actions/upload-artifact@v4
        with:
          name: nspire_ai_tns
          path: dist/nspire_ai.tns
          if-no-files-found: error

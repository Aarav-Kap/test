name: Build NspireAI v0.5

on:
  workflow_dispatch:
  push:
    paths:
      - "calculator/**"
      - "host/**"
      - ".github/workflows/build.yml"

jobs:
  calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build calculator
        run: |
          mkdir -p dist
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work/calculator \
            bensuperpc/ndless@sha256:fb11585d8f6aa43e69692911b713b41958fcf83aa465729210a2be5906e04093 make
      - uses: actions/upload-artifact@v4
        with:
          name: calculator
          path: dist/nspire_ai.tns

  windows-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows bridge
        working-directory: host
        run: cargo build --release
      - name: Stage
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item host\target\release\nspire-ai-bridge.exe dist\
          Copy-Item host\SET_KEY_AND_RUN.bat dist\
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bridge
          path: dist/*
